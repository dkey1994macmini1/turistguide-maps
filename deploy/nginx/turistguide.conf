server {
    listen 127.0.0.1:8443 ssl;
    server_name turistguide.karwackid.cloud;

    ssl_certificate     /opt/homebrew/etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /opt/homebrew/etc/nginx/ssl/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    server_tokens off;

    root /Users/damiankarwacki/projects/turistguide-maps/public;
    index index.html;
    charset utf-8;

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
